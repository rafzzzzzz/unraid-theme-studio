<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UNRAID Theme Studio — Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../source/theme.studio/usr/local/emhttp/plugins/theme.studio/sheets/ThemeStudio.css">
  <style>html,body{margin:0;min-height:100%;background:#0c0c0c}#preview-error{padding:30px;color:#ff8b8b;font-family:system-ui}</style>
</head>
<body>
  <div id="preview-error">Loading Theme Studio…</div>
  <script>
    fetch('../source/theme.studio/usr/local/emhttp/plugins/theme.studio/ThemeStudio.page')
      .then(function (response) { if (!response.ok) throw new Error('Could not load the plugin page'); return response.text(); })
      .then(function (page) {
        var marker = page.indexOf('\n---\n');
        var html = page.slice(marker + 5)
          .replace(/^<\?php[\s\S]*?\?>\s*/,'')
          .replace(/<script>\s*window\.ThemeStudioBootstrap[\s\S]*?<\/script>/, '<script>window.ThemeStudioBootstrap={mock:true,config:{},defaults:{enabled:true,name:"Midnight Orange",background:"#121212",surface:"#1D1B1B",surfaceAlt:"#262626",text:"#F2F2F2",textMuted:"#A8A8A8",accent:"#FF8C2F",accentHover:"#FFAD66",border:"#404040",headerBackground:"#1D1B1B",headerText:"#FFFFFF",positive:"#33CC33",warning:"#FFD324",danger:"#E22828",radius:8,density:"comfortable"}};<\/script>')
          .replace(/\/plugins\/theme\.studio\/assets\/theme-studio\.js\?v=[^"']+/,'../source/theme.studio/usr/local/emhttp/plugins/theme.studio/assets/theme-studio.js');
        document.body.innerHTML = html;
        Array.prototype.slice.call(document.body.querySelectorAll('script')).forEach(function (oldScript) {
          var script = document.createElement('script');
          if (oldScript.src) script.src = oldScript.src; else script.text = oldScript.text;
          oldScript.replaceWith(script);
        });
      })
      .catch(function (error) { document.getElementById('preview-error').textContent = error.message + '. Serve the repository over HTTP rather than opening this file directly.'; });
  </script>
</body>
</html>
